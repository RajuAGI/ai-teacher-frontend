<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - AI Teacher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="page-container">
    <div class="page-header">
      <h1>📞 संपर्क करें</h1>
      <p>कोई भी सवाल हो — हम यहाँ हैं!</p>
    </div>

    <div class="contact-grid">
      <div class="contact-info">
        <div class="contact-item">
          <span>📧</span>
          <div>
            <h3>Web</h3>
            <p>https://rajuagi.github.io/teamcoin-frontend/</p>
          </div>
        </div>
        <div class="contact-item">
          <span>📱</span>
          <div>
            <h3>WhatsApp</h3>
            <p>+91 XXXXX XXXXX</p>
          </div>
        </div>
        <div class="contact-item">
          <span>🌐</span>
          <div>
            <h3>Website</h3>
            <p>rajuagi.github.io/ai-teacher-frontend</p>
          </div>
        </div>
        <div class="contact-item">
          <span>⏰</span>
          <div>
            <h3>उपलब्धता</h3>
            <p>24/7 — कभी भी संपर्क करें</p>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <h2>Message भेजें</h2>
        <input type="text" id="contactName" placeholder="आपका नाम" />
        <input type="email" id="contactEmail" placeholder="आपका Email" />
        <textarea id="contactMessage" placeholder="आपका message..." rows="5"></textarea>
        <button onclick="sendMessage()">📤 भेजें</button>
        <p id="formStatus" style="font-size:14px;text-align:center;min-height:20px"></p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="nav-footer.js"></script>
  <script>
    function sendMessage() {
      const name = document.getElementById("contactName").value.trim();
      const email = document.getElementById("contactEmail").value.trim();
      const message = document.getElementById("contactMessage").value.trim();
      const status = document.getElementById("formStatus");

      if (!name || !email || !message) {
        status.style.color = "#e94560";
        status.innerText = "❌ कृपया सभी fields भरें!";
        return;
      }

      status.style.color = "#2ecc71";
      status.innerText = "✅ आपका message मिल गया! जल्द जवाब देंगे।";
      document.getElementById("contactName").value = "";
      document.getElementById("contactEmail").value = "";
      document.getElementById("contactMessage").value = "";
    }
  </script>
</body>
</html>
