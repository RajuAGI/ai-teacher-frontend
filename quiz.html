<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - AI Teacher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="page-container">
    <div class="page-header">
      <h1>🧠 Quiz खेलो</h1>
      <p>अपना ज्ञान परखो और score बढ़ाओ!</p>
    </div>

    <div class="quiz-box">

      <div id="quizStart">
        <h2>Topic चुनो:</h2>
        <div class="quiz-topics">
          <button onclick="startQuiz('gk')">🌍 सामान्य ज्ञान</button>
          <button onclick="startQuiz('science')">🔬 विज्ञान</button>
          <button onclick="startQuiz('math')">➕ गणित</button>
          <button onclick="startQuiz('history')">🏛️ इतिहास</button>
        </div>
      </div>

      <div id="quizGame" style="display:none">
        <div class="quiz-progress">
          <span id="questionNum">सवाल 1/5</span>
          <span id="scoreDisplay">Score: 0</span>
        </div>
        <div class="question-box">
          <h2 id="questionText"></h2>
        </div>
        <div id="optionsBox" class="options-grid"></div>
        <p id="quizFeedback"></p>
      </div>

      <div id="quizResult" style="display:none">
        <div class="result-box">
          <h2>🎉 Quiz खत्म!</h2>
          <div class="final-score" id="finalScore"></div>
          <p id="resultMessage"></p>
          <button onclick="resetQuiz()">🔄 फिर खेलो</button>
        </div>
      </div>

    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="nav-footer.js"></script>
  <script>
    const questions = {
      gk: [
        { q: "भारत की राजधानी क्या है?", options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], ans: 1 },
        { q: "भारत का राष्ट्रीय खेल कौन सा है?", options: ["क्रिकेट", "हॉकी", "फुटबॉल", "कबड्डी"], ans: 1 },
        { q: "भारत के प्रथम प्रधानमंत्री कौन थे?", options: ["सरदार पटेल", "महात्मा गांधी", "जवाहरलाल नेहरू", "डॉ. आंबेडकर"], ans: 2 },
        { q: "भारत में कितने राज्य हैं?", options: ["25", "28", "29", "31"], ans: 1 },
        { q: "भारत का सबसे बड़ा राज्य कौन सा है?", options: ["महाराष्ट्र", "उत्तर प्रदेश", "राजस्थान", "मध्य प्रदेश"], ans: 2 }
      ],
      science: [
        { q: "पानी का रासायनिक सूत्र क्या है?", options: ["CO2", "H2O", "O2", "NaCl"], ans: 1 },
        { q: "सूर्य से पृथ्वी तक प्रकाश कितने समय में आता है?", options: ["8 मिनट", "1 घंटा", "1 दिन", "1 मिनट"], ans: 0 },
        { q: "मनुष्य के शरीर में कितनी हड्डियाँ होती हैं?", options: ["206", "208", "200", "210"], ans: 0 },
        { q: "DNA का पूरा नाम क्या है?", options: ["Deoxyribonucleic Acid", "Dinucleic Acid", "Deoxyribose Acid", "Double Nucleic Acid"], ans: 0 },
        { q: "प्रकाश की गति क्या है?", options: ["3 लाख km/s", "1 लाख km/s", "5 लाख km/s", "2 लाख km/s"], ans: 0 }
      ],
      math: [
        { q: "15 × 15 = ?", options: ["215", "225", "235", "245"], ans: 1 },
        { q: "√144 = ?", options: ["11", "12", "13", "14"], ans: 1 },
        { q: "1000 का 15% कितना होगा?", options: ["100", "150", "200", "250"], ans: 1 },
        { q: "त्रिभुज के कोणों का योग कितना होता है?", options: ["90°", "180°", "270°", "360°"], ans: 1 },
        { q: "2³ = ?", options: ["6", "8", "9", "12"], ans: 1 }
      ],
      history: [
        { q: "भारत को आज़ादी कब मिली?", options: ["1945", "1947", "1950", "1952"], ans: 1 },
        { q: "महात्मा गांधी का जन्म कब हुआ?", options: ["1867", "1869", "1871", "1875"], ans: 1 },
        { q: "भारतीय संविधान कब लागू हुआ?", options: ["1947", "1948", "1950", "1952"], ans: 2 },
        { q: "ताजमहल किसने बनवाया?", options: ["अकबर", "औरंगज़ेब", "शाहजहाँ", "हुमायूं"], ans: 2 },
        { q: "प्रथम विश्व युद्ध कब हुआ?", options: ["1910-1914", "1914-1918", "1918-1922", "1920-1924"], ans: 1 }
      ]
    };

    let currentQuiz = [], currentQ = 0, score = 0;

    function startQuiz(topic) {
      currentQuiz = questions[topic];
      currentQ = 0; score = 0;
      document.getElementById("quizStart").style.display = "none";
      document.getElementById("quizGame").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      const q = currentQuiz[currentQ];
      document.getElementById("questionNum").innerText = `सवाल ${currentQ + 1}/${currentQuiz.length}`;
      document.getElementById("scoreDisplay").innerText = `Score: ${score}`;
      document.getElementById("questionText").innerText = q.q;
      document.getElementById("quizFeedback").innerText = "";

      const box = document.getElementById("optionsBox");
      box.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i, btn);
        box.appendChild(btn);
      });
    }

    function checkAnswer(selected, btn) {
      const q = currentQuiz[currentQ];
      const btns = document.querySelectorAll("#optionsBox button");
      btns.forEach(b => b.disabled = true);

      if (selected === q.ans) {
        btn.style.background = "#2ecc71";
        score++;
        document.getElementById("quizFeedback").innerText = "✅ शाबाश! बिल्कुल सही!";
      } else {
        btn.style.background = "#e74c3c";
        btns[q.ans].style.background = "#2ecc71";
        document.getElementById("quizFeedback").innerText = "❌ गलत! सही जवाब हरे रंग में है।";
      }

      setTimeout(() => {
        currentQ++;
        if (currentQ < currentQuiz.length) showQuestion();
        else showResult();
      }, 1500);
    }

    function showResult() {
      document.getElementById("quizGame").style.display = "none";
      document.getElementById("quizResult").style.display = "block";
      document.getElementById("finalScore").innerText = `${score}/${currentQuiz.length}`;

      let msg = score === currentQuiz.length ? "🏆 Perfect Score! बहुत बढ़िया!"
        : score >= 3 ? "👏 शाबाश! अच्छा किया!"
        : "📚 और पढ़ाई करो — अगली बार बेहतर करोगे!";
      document.getElementById("resultMessage").innerText = msg;
    }

    function resetQuiz() {
      document.getElementById("quizResult").style.display = "none";
      document.getElementById("quizStart").style.display = "block";
    }
  </script>
</body>
</html>
