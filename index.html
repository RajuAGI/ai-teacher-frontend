<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Teacher - Raju Ram</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">🧑‍🏫 राजू राम</div>
    <button class="nav-toggle" onclick="toggleMenu()">☰</button>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="leaderboard.html">Leaderboard</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="login-btn">Login</a></li>
    </ul>
  </nav>

  <div class="container">

    <!-- Teacher Avatar -->
    <div class="teacher-box">
      <div class="avatar">
        <img src="photo.jpg" alt="Raju AGI" />
      </div>
      <h1>Raju Ram Bajya</h1>
      <p class="subtitle">Ask me anything — I'll explain and speak! with help of AI.</p>
    </div>

    <!-- Input Box -->
    <div class="input-box">
      <input type="text" id="questionInput" placeholder="Ask your question here..." />
      <button onclick="askTeacher()">Ask ➤</button>
    </div>

    <!-- Answer Box -->
    <div class="answer-box" id="answerBox">
      <p id="answerText">Your answer will appear here...</p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button onclick="speakAnswer()" id="speakBtn" disabled>🔊 Speak Answer</button>
      <button onclick="stopSpeaking()" id="stopBtn" disabled>⏹ Stop</button>
    </div>

  </div>

  <footer class="page-footer">
    <p>© 2025 AI Teacher - राजू राम। सर्वाधिकार सुरक्षित।</p>
  </footer>

  <script src="script.js"></script>
  <script>
  function toggleMenu() {
    const ul = document.querySelector("nav ul");
    ul.classList.toggle("active");
  }
  </script>
</body>
</html>
