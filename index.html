<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Teacher - Raju Ram</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">🧑‍🏫 RajU AI</div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <ul class="nav-links" id="navLinks">
    <li><a href="#">Home</a></li>
    <li><a href="#">Courses</a></li>
    <li><a href="#">Quiz</a></li>
    <li><a href="#">Leaderboard</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</header>

<main class="main-container">

  <section class="teacher-card">
    <img src="photo.jpg" alt="Raju Ram">
    <h1>Raju Ram Bajya</h1>
    <p class="tagline">AI Powered Smart Teacher • Ask Anything</p>
  </section>

  <section class="ask-section">
    <div class="input-group">
      <input type="text" placeholder="Ask your question...">
      <button>Ask ➤</button>
    </div>
  </section>

  <section class="answer-section">
    <h3>Answer</h3>
    <div class="answer-box">
      Your answer will appear here...
    </div>
  </section>

  <section class="search-section">
    <h3>🌐 Web Search</h3>
    <div class="input-group">
      <input type="text" placeholder="Search anything...">
      <button>Search</button>
    </div>
  </section>

  <section class="controls">
    <button class="primary">🔊 Speak</button>
    <button class="danger">⏹ Stop</button>
  </section>

</main>

<footer>
  © 2026 AI Teacher - Raju Ram. All Rights Reserved.
</footer>

<script>
function toggleMenu(){
  document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
