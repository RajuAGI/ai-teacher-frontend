<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Teacher - राजू राम</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">

  <style>
    #aiAvatar {
      width: 150px;
      border-radius: 50%;
      border: 4px solid #fff;
      transition: transform 0.3s ease;
    }

    .speaking {
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body class="home-page">

  <div id="nav-placeholder"></div>

  <div class="container">

    <div class="teacher-box">

      <div class="avatar">
        <img id="aiAvatar" src="photo.jpg" alt="Raju Ram" />
      </div>

      <h1>Raju Ram Bajya</h1>
      <p class="subtitle">
        कोई भी सवाल पूछो — मैं समझाऊंगा और बोलूंगा! 🎓
      </p>
    </div>

    <div class="input-box">
      <input type="text" id="questionInput" placeholder="अपना सवाल यहाँ लिखें..." />
      <button onclick="askTeacher()">पूछो ➤</button>
    </div>

    <div class="answer-box" id="answerBox">
      <p id="answerText">आपका जवाब यहाँ दिखेगा...</p>
    </div>

    <div class="controls">
      <button onclick="speakAnswer()" id="speakBtn" disabled>🔊 सुनो</button>
      <button onclick="stopSpeaking()" id="stopBtn" disabled>⏹ रोको</button>
    </div>

  </div>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="nav-footer.js"></script>

</body>
</html>
