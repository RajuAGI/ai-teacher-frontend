<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Teacher - राजू राम</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Placeholder -->
  <div id="nav-placeholder"></div>

  <!-- Main Container -->
  <div class="container">

    <!-- AI Teacher Section -->
    <div class="teacher-box">
      <div class="avatar">
        <img src="photo.jpg" alt="Raju AGI" />
      </div>
      <h1>Raju Ram Bajya</h1>
      <p class="subtitle">Ask me anything — I'll explain and speak! Last knowledge: Dec 2023. Best on desktop, mobile friendly improved.</p>
    </div>

    <!-- Input Box -->
    <div class="input-box">
      <input type="text" id="questionInput" placeholder="Apna sawal yahan likhe..." />
      <button onclick="askTeacher()">Ask ➤</button>
    </div>

    <!-- Answer Box -->
    <div class="answer-box" id="answerBox">
      <p id="answerText">Aapka jawab yahan dikhega...</p>
    </div>

    <!-- Google / Web Search -->
    <div class="search-section">
      <h3>🔍 Web Search</h3>
      <div class="search-input-box">
        <input type="text" id="searchInput" placeholder="Kuch search karein..." />
        <button onclick="doSearch()">Search 🔍</button>
      </div>
      <div id="searchResults" class="search-results-box" style="display:none"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button onclick="speakAnswer()" id="speakBtn" disabled>🔊 Speak Answer</button>
      <button onclick="stopSpeaking()" id="stopBtn" disabled>⏹ Stop</button>
    </div>

  </div>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- JS -->
  <script src="script.js"></script>
  <script src="nav-footer.js"></script>
</body>
</html>
