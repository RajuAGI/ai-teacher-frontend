<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - AI Teacher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <style>
    .lb-loading { text-align:center;padding:40px;font-size:1.1rem;color:rgba(255,255,255,0.5); }
    .lb-empty { text-align:center;padding:50px 20px;color:rgba(255,255,255,0.5); }
    .lb-empty .ei { font-size:3rem;margin-bottom:10px; }
    .total-tag { text-align:center;color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:16px; }

    .top-three { display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:28px;flex-wrap:wrap; }
    .top-card {
      background:white;border-radius:16px;padding:18px 14px;text-align:center;
      box-shadow:0 4px 16px rgba(0,0,0,0.12);min-width:110px;max-width:140px;flex:1;
      transition:transform 0.2s;
    }
    .top-card:hover { transform:translateY(-4px); }
    .top-card.first  { border-top:4px solid #f5c518;order:2;padding-top:26px; }
    .top-card.second { border-top:4px solid #b0b8c1;order:1; }
    .top-card.third  { border-top:4px solid #cd7f32;order:3; }
    .top-card .rank      { font-size:2rem;margin-bottom:4px; }
    .top-card h3         { font-size:0.9rem;margin:0 0 4px;font-weight:700;color:#222;word-break:break-word; }
    .top-card .sc        { font-size:0.85rem;font-weight:600;color:#555; }
    .top-card .pct       { font-size:0.75rem;color:#aaa;margin-top:2px; }
    .top-card .tp        { font-size:0.7rem;color:#bbb;margin-top:4px;word-break:break-word; }

    .leaderboard-table { width:100%;border-collapse:collapse;font-size:0.9rem; }
    .leaderboard-table thead tr { background:#f0f4ff; }
    .leaderboard-table th { padding:10px 8px;text-align:left;font-weight:700;color:#444;border-bottom:2px solid #dde3f5; }
    .leaderboard-table td { padding:10px 8px;border-bottom:1px solid #f0f0f0;color:#333;vertical-align:middle; }
    .leaderboard-table tr:last-child td { border-bottom:none; }
    .leaderboard-table tr:hover td { background:#f9f9ff; }

    .rk { font-weight:700;color:#aaa;text-align:center; }
    .rk.top { color:#f5c518; }
    .pbar-w { background:#eee;border-radius:99px;height:7px;width:60px;display:inline-block;vertical-align:middle;margin-left:5px; }
    .pbar   { height:7px;border-radius:99px;background:linear-gradient(90deg,#e94560,#6fcf97); }
    .qbadge { font-size:0.72rem;background:#f0f4ff;color:#e94560;border-radius:99px;padding:2px 8px;font-weight:600; }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="page-container">
    <div class="page-header">
      <h1>🏆 Leaderboard</h1>
      <p>सबसे मेहनती Students!</p>
    </div>

    <div class="leaderboard-box">

      <div id="lb-loading" class="lb-loading">⏳ Leaderboard load हो रहा है...</div>

      <div id="lb-empty" class="lb-empty" style="display:none">
        <div class="ei">📭</div>
        <p><strong>अभी कोई Score नहीं!</strong></p>
        <p>Quiz खेलो और यहाँ दिखो 🎯</p>
      </div>

      <div id="lb-content" style="display:none">
        <p class="total-tag" id="total-tag"></p>
        <div class="top-three" id="top-three"></div>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th style="text-align:center">Rank</th>
              <th>Student</th>
              <th>Best Score</th>
              <th>Quizzes</th>
            </tr>
          </thead>
          <tbody id="lb-tbody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="nav-footer.js"></script>
  <script>
    const BACKEND_URL = "https://ai-teacher-backend-ngbs.onrender.com";

    function esc(s) {
      return String(s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    async function loadLeaderboard() {
      try {
        const res  = await fetch(`${BACKEND_URL}/leaderboard`);
        const data = await res.json();

        document.getElementById("lb-loading").style.display = "none";

        const list = data.leaderboard || [];
        if (list.length === 0) {
          document.getElementById("lb-empty").style.display = "block";
          return;
        }

        document.getElementById("lb-content").style.display = "block";
        document.getElementById("total-tag").textContent =
          `कुल ${data.total_players} Students ने Quiz खेली है`;

        // TOP 3
        const top3    = list.slice(0, 3);
        const order   = [1, 0, 2];
        const classes = ["second", "first", "third"];
        const medals  = ["🥇", "🥈", "🥉"];
        const topDiv  = document.getElementById("top-three");

        order.forEach((idx, pos) => {
          if (!top3[idx]) return;
          const p    = top3[idx];
          const card = document.createElement("div");
          card.className = `top-card ${classes[pos]}`;
          card.innerHTML = `
            <div class="rank">${medals[idx]}</div>
            <h3>${esc(p.name)}</h3>
            <div class="sc">${p.best_score}/${p.best_total}</div>
            <div class="pct">${p.percentage}%</div>
            <div class="tp">${esc(p.best_topic || "")}</div>
          `;
          topDiv.appendChild(card);
        });

        // TABLE
        const tbody = document.getElementById("lb-tbody");
        list.forEach((p, i) => {
          const rank = i + 1;
          const tr   = document.createElement("tr");
          tr.innerHTML = `
            <td class="rk ${rank <= 3 ? 'top' : ''}">${rank}</td>
            <td>
              <strong>${esc(p.name)}</strong>
              <div style="font-size:0.72rem;color:#aaa;">${esc(p.best_topic || "")}</div>
            </td>
            <td>
              ${p.best_score}/${p.best_total}
              <span class="pbar-w"><span class="pbar" style="width:${p.percentage}%"></span></span>
              <span style="font-size:0.75rem;color:#888;margin-left:4px">${p.percentage}%</span>
            </td>
            <td><span class="qbadge">${p.games_played} Quiz</span></td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        document.getElementById("lb-loading").innerHTML =
          "❌ Leaderboard load नहीं हो पाया। दोबारा try करो।";
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
